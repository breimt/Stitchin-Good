name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install build dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build self-contained DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: Verify Intel and Apple silicon slices
        run: |
          executable=$(find dist -path '*/Contents/MacOS/*' -type f | head -1)
          test -n "$executable"
          lipo -info "$executable" | grep -Eq 'x86_64.*arm64|arm64.*x86_64'
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: stitchin-good-macos
          path: |
            app/dist/*.dmg
          if-no-files-found: error
